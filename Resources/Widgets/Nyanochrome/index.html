<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>NyanCat</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}
  #c{image-rendering:pixelated;display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// Nyanochrome Cat — a faithful port of Josh Juran's monochrome Nyan Cat
// (metamage_1/apps/mac/NyanochromeCat), itself a 1-bit parody of Christopher Torres' Nyan Cat.
// Original C++ drawing (graphics.cc.hh) and QuickDraw dither patterns (Graphics.cc) ported to
// canvas. Base scene 70x72, pixel-zoom 4 → 280x288, 12 animation frames.  AGPL-3.0 upstream.

const NW = 70, NH = 72, Z = 4, W = NW * Z, H = NH * Z;
const TBH = 22;                                   // System-6 title-bar height (device px)

// QuickDraw 8x8 patterns: a set bit (1) is BLACK, aligned to the port origin.
const black = [0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF,0xFF];
const white = [0x00,0x00,0x00,0x00,0x00,0x00,0x00,0x00];
const dkGray = [0x77,0xDD,0x77,0xDD,0x77,0xDD,0x77,0xDD];
const gray   = [0xAA,0x55,0xAA,0x55,0xAA,0x55,0xAA,0x55];
const ltGray = [0x88,0x22,0x88,0x22,0x88,0x22,0x88,0x22];
const veryDarkGray = [0x77,0xFF,0xDD,0xFF,0x77,0xFF,0xDD,0xFF];
const furrr = gray, blush = ltGray;               // fur / cheeks
const toast = white, icing = ltGray, spots = dkGray;                 // pop-tart
const red = gray, orange = ltGray, yellow = white, green = ltGray, blue = gray, violet = dkGray;
const wave_colors = [red, orange, yellow, green, blue, violet];

const patBit = (p, X, Y) => (p[Y & 7] >> (7 - (X & 7))) & 1;

// ---- bitmap writer (into the current frame's ImageData `d`) ----
let d;
function setpx(X, Y, on) { if (X < 0 || X >= W || Y < 0 || Y >= H) return; const i = (Y * W + X) * 4, v = on ? 0 : 255; d[i] = d[i+1] = d[i+2] = v; d[i+3] = 255; }
function fill_rect(x, y, dx, dy, p) { for (let by = 0; by < dy; by++) for (let bx = 0; bx < dx; bx++) { const X0 = (x+bx)*Z, Y0 = (y+by)*Z; for (let zy = 0; zy < Z; zy++) for (let zx = 0; zx < Z; zx++) setpx(X0+zx, Y0+zy, patBit(p, X0+zx, Y0+zy)); } }
function set_pixel(x, y, p) { fill_rect(x, y, 1, 1, p); }

// ---- rainbow waves ----
function draw_wave(y, stage, color) {
  const a = stage ? 0 : 1, b = stage ? 1 : 0; let x = 0, dx = 2 + a, dy = 3;
  fill_rect(x, y + a, dx, dy, color); x += dx; dx = 8;
  fill_rect(x, y + b, dx, dy, color); x += dx; dx = 8;
  fill_rect(x, y + a, dx, dy, color); x += dx; dx = 7 + b;
  fill_rect(x, y + b, dx, dy, color); x += dx;
  if (stage === 0) set_pixel(x, y, color);
}
function draw_waves(y, step) { for (let i = 0; i < 6; i++) { draw_wave(y, step, wave_colors[i]); y += 3; } }

// ---- fireworks / stars ----
const fireworks = [
  { y: 1,  t0: 1, dt: 1,  xes: [42,36,28,19,10,4,0,-6,68,60,52,46] },
  { y: 10, t0: 3, dt: 1,  xes: [68,60,52,46,42,36,28,19,10,4,0,-6] },
  { y: 22, t0: 1, dt: 1,  xes: [1,-5,69,61,53,47,43,37,29,20,11,5] },
  { y: 44, t0: 4, dt: 1,  xes: [-9,-9,-9,-9,-9,69,61,53,44,-9,-9,-9] },
  { y: 44, t0: 5, dt: 1,  xes: [11,5,1,-5,-9,-9,-9,-9,-9,37,29,20] },
  { y: 58, t0: 1, dt: -1, xes: [70,66,60,51,42,34,28,24,18,10,2,-1] },
  { y: 68, t0: 2, dt: 1,  xes: [38,30,21,12,6,2,-4,70,62,54,48,44] },
];
function draw_star(x, y, stage) {
  switch (stage) {
    case 0: set_pixel(x, y, white); break;
    case 1: set_pixel(x, y-1, white); set_pixel(x-1, y, white); set_pixel(x+1, y, white); set_pixel(x, y+1, white); break;
    case 2: fill_rect(x, y-2, 1, 2, white); fill_rect(x-2, y, 2, 1, white); fill_rect(x+1, y, 2, 1, white); fill_rect(x, y+1, 1, 2, white); break;
    case 3: fill_rect(x, y-3, 1, 2, white); fill_rect(x-3, y, 2, 1, white); set_pixel(x, y, white); fill_rect(x+2, y, 2, 1, white); fill_rect(x, y+2, 1, 2, white); break;
    case 4: set_pixel(x, y-3, white); set_pixel(x-2, y-2, white); set_pixel(x+2, y-2, white); set_pixel(x-3, y, white); set_pixel(x+3, y, white); set_pixel(x-2, y+2, white); set_pixel(x+2, y+2, white); set_pixel(x, y+3, white); break;
    case 5: set_pixel(x, y-3, white); set_pixel(x-3, y, white); set_pixel(x+3, y, white); set_pixel(x, y+3, white); break;
  }
}
function draw_fireworks(t) {
  for (let i = 0; i < 7; i++) { const s = fireworks[i], x = s.xes[t]; let stage = (s.t0 + t * s.dt + 12) % 6; if (x === -1) stage = 4; draw_star(x, s.y, stage); }
}

// ---- tail (6 stages) ----
function tail0(x, y) { y -= 4;
  fill_rect(x-6,y,4,1,black); y++; fill_rect(x-6,y,5,1,black); fill_rect(x-5,y,2,1,furrr); y++;
  fill_rect(x-6,y,6,1,black); fill_rect(x-4,y,2,1,furrr); y++; fill_rect(x-5,y,5,1,black); fill_rect(x-3,y,2,1,furrr); y++;
  fill_rect(x-4,y,2,1,black); fill_rect(x-2,y,2,1,furrr); y++; fill_rect(x-3,y,3,1,black); y++; set_pixel(x-1,y,black); }
function tail1(x, y) { y -= 3;
  fill_rect(x-5,y,2,1,black); y++; fill_rect(x-6,y,4,1,black); fill_rect(x-5,y,2,1,furrr); y++;
  fill_rect(x-6,y,6,1,black); fill_rect(x-5,y,2,1,furrr); y++; set_pixel(x-5,y,black); fill_rect(x-4,y,4,1,furrr); y++;
  fill_rect(x-4,y,2,1,black); fill_rect(x-2,y,2,1,furrr); y++; fill_rect(x-2,y,2,1,black); }
function tail2(x, y) { set_pixel(x-1,y-1,black); fill_rect(x-4,y,4,1,black); y++;
  fill_rect(x-6,y,2,1,black); fill_rect(x-4,y,4,1,furrr); y++; fill_rect(x-6,y,6,1,black); fill_rect(x-5,y,3,1,furrr); y++;
  fill_rect(x-5,y,4,1,black); }
function tail3(x, y) { fill_rect(x-2,y-1,2,1,black); fill_rect(x-4,y,2,1,black); fill_rect(x-2,y,2,1,furrr); y++;
  set_pixel(x-5,y,black); fill_rect(x-4,y,4,1,furrr); y++; fill_rect(x-6,y,6,1,black); fill_rect(x-5,y,2,1,furrr); y++;
  fill_rect(x-6,y,4,1,black); fill_rect(x-5,y,2,1,furrr); y++; fill_rect(x-5,y,2,1,black); }
function tail4(x, y) { y -= 3;
  fill_rect(x-6,y,4,1,black); y++; fill_rect(x-7,y,7,2,black); fill_rect(x-6,y,3,1,furrr); y++;
  fill_rect(x-5,y,4,1,furrr); y++; fill_rect(x-5,y,4,1,black); set_pixel(x-1,y,furrr); y++; set_pixel(x-2,y,black); set_pixel(x-1,y,black); }
function tail5(x, y) { y -= 4;
  fill_rect(x-5,y,2,1,black); y++; fill_rect(x-6,y,4,1,black); fill_rect(x-5,y,2,1,furrr); y++;
  fill_rect(x-6,y,6,1,black); fill_rect(x-5,y,2,1,furrr); y++; set_pixel(x-5,y,black); fill_rect(x-4,y,4,1,furrr); y++;
  fill_rect(x-4,y,2,1,black); fill_rect(x-2,y,2,1,furrr); y++; fill_rect(x-2,y,2,1,black); }
const tails = [tail0, tail1, tail2, tail3, tail4, tail5];
function draw_tail(x, y, stage) { tails[stage](x, y); }

// ---- paws ----
function paw_a(x, y) { fill_rect(x,y,4,1,black); fill_rect(x+1,y,2,1,furrr); y++; fill_rect(x+1,y,2,1,black); }
function paw_b(x, y) { paw_a(x,y); set_pixel(x+2,y-1,furrr); fill_rect(x+3,y-1,1,3,black); }
function paw_c(x, y) { paw_a(x,y); set_pixel(x,y+1,black); }
function paw_d(x, y) { paw_c(x-2,y); y -= 2; set_pixel(x-1,y,black); y++; set_pixel(x-2,y,black); fill_rect(x-1,y,3,1,furrr); y++; set_pixel(x+2,y,black); y++; set_pixel(x+1,y,black); }
function paw_e(x, y) { paw_c(x-1,y); y--; set_pixel(x-1,y,black); fill_rect(x,y,2,1,furrr); }
function paw_f(x, y) { paw_c(x,y); y--; set_pixel(x,y,black); set_pixel(x+1,y,furrr); }
function paw_gh(x, y) { paw_c(x-3,y); y -= 3; set_pixel(x-1,y,black); y++; set_pixel(x-2,y,black); y++; set_pixel(x-3,y,black); set_pixel(x-2,y,furrr); set_pixel(x-1,y,furrr); set_pixel(x,y,furrr); set_pixel(x+1,y,black); }
function paw_g(x, y) { paw_gh(x,y); set_pixel(x-1,y-2,black); }
function paw_h(x, y) { paw_gh(x,y); set_pixel(x-1,y-2,furrr); }
function paws0(x, y) { paw_a(x+18,y); paw_b(x+13,y); paw_c(x+4,y); paw_d(x,y); }
function paws1(x, y) { paw_b(x+19,y); paw_b(x+14,y); paw_b(x+4,y); paw_e(x,y); }
function paws2(x, y) { paw_b(x+20,y); paw_b(x+15,y); paw_b(x+5,y); paw_f(x,y); }
function paws3(x, y) { paws1(x, y); }
function paws4(x, y) { paw_b(x+17,y); paw_b(x+12,y); paw_b(x+2,y); paw_g(x,y); }
function paws5(x, y) { paw_b(x+17,y); paw_c(x+12,y); paw_c(x+2,y); paw_h(x,y); }
const pawsF = [paws0, paws1, paws2, paws3, paws4, paws5];
function draw_paws(x, y, stage) { pawsF[stage](x, y); }

// ---- body (pop-tart) ----
function draw_body(x, y) { const width = 21, height = 18;
  fill_rect(x+2,y,width-4,1,black); fill_rect(x+2,y+1,width-4,1,toast); fill_rect(x+2,y+height-2,width-4,1,toast); fill_rect(x+2,y+height-1,width-4,1,black);
  set_pixel(x+1,y+1,black); set_pixel(x+width-2,y+1,black); set_pixel(x+1,y+height-2,black); set_pixel(x+width-2,y+height-2,black);
  fill_rect(x,y+2,1,height-4,black); fill_rect(x+1,y+2,1,height-4,toast);
  fill_rect(x+2,y+2,width-4,height-4,icing);
  fill_rect(x+width-2,y+2,1,height-4,toast); fill_rect(x+width-1,y+2,1,height-4,black); set_pixel(x,y+height-2,black);
  fill_rect(x+2,y+2,2,1,toast); fill_rect(x+width-4,y+2,2,1,toast); set_pixel(x+2,y+3,toast); set_pixel(x+width-3,y+3,toast);
  set_pixel(x+2,y+height-4,toast); set_pixel(x+width-3,y+height-4,toast); fill_rect(x+2,y+height-3,2,1,toast); fill_rect(x+width-4,y+height-3,2,1,toast);
  const sp = [[9,3],[12,3],[4,4],[16,5],[8,7],[5,9],[9,10],[3,11],[7,13],[4,14]]; for (const [sx, sy] of sp) set_pixel(x+sx, y+sy, spots); }

// ---- head ----
function draw_head(x, y) {
  fill_rect(x+2,y,2,1,black); fill_rect(x+12,y,2,1,black); y++;
  fill_rect(x+1,y,4,4,black); fill_rect(x+2,y,2,1,furrr); fill_rect(x+11,y,4,4,black); fill_rect(x+12,y,2,1,furrr); y++;
  fill_rect(x+2,y,3,1,furrr); set_pixel(x+5,y,black); set_pixel(x+10,y,black); fill_rect(x+11,y,3,1,furrr); y++;
  fill_rect(x+2,y,12,2,furrr); fill_rect(x+6,y,4,1,black); y++; y++;
  fill_rect(x+0,y,16,5,black); fill_rect(x+1,y,14,5,furrr); y++;
  fill_rect(x+4,y,2,2,black); set_pixel(x+4,y,white); fill_rect(x+11,y,2,2,black); set_pixel(x+11,y,white); y++;
  set_pixel(x+9,y,black); y++;
  fill_rect(x+2,y,2,2,blush); fill_rect(x+13,y,2,2,blush); y++;
  set_pixel(x+5,y,black); set_pixel(x+8,y,black); set_pixel(x+11,y,black); y++;
  fill_rect(x+1,y,14,1,black); fill_rect(x+2,y,3,1,furrr); fill_rect(x+12,y,2,1,furrr); y++;
  fill_rect(x+2,y,12,1,black); fill_rect(x+3,y,10,1,furrr); y++;
  fill_rect(x+3,y,10,1,black); }

const div_3_mod_2 = [0,0,0,1,1,1,0,0,0,1,1,1,0,0];
function draw_frame(t) {
  fill_rect(0, 0, NW, NH, veryDarkGray);          // space background
  const step = (t & 2) ? 1 : 0;
  draw_waves(26, step);
  draw_fireworks(t);
  const body_base_x = 25, body_base_y = 25, head_base_x = 35, head_base_y = 30;
  const body_y = body_base_y + ((Math.floor(t / 2) % 3 > 0) ? 1 : 0);
  const head_x = head_base_x + div_3_mod_2[t + 2];
  const head_y = head_base_y + div_3_mod_2[t + 1];
  draw_paws(body_base_x, body_y + 18, t % 6);
  draw_tail(body_base_x, body_y + 11, t % 6);
  draw_body(body_base_x, body_y);
  draw_head(head_x, head_y);
}

// ---- precompute the 12 frames as offscreen canvases ----
const frames = [];
for (let t = 0; t < 12; t++) {
  const oc = document.createElement('canvas'); oc.width = W; oc.height = H;
  const octx = oc.getContext('2d'); const img = octx.createImageData(W, H); d = img.data;
  draw_frame(t); octx.putImageData(img, 0, 0); frames.push(oc);
}

// ---- visible canvas: System-6 title bar + animated scene ----
const cv = document.getElementById('c'); cv.width = W; cv.height = TBH + H;
const g = cv.getContext('2d'); g.imageSmoothingEnabled = false;
function titleBar() {
  g.fillStyle = '#fff'; g.fillRect(0, 0, W, TBH);
  g.fillStyle = '#000';
  for (let ly = 4; ly <= TBH - 6; ly += 3) g.fillRect(2, ly, W - 4, 1);   // racing stripes
  g.fillRect(0, 0, W, 2); g.fillRect(0, TBH - 2, W, 2); g.fillRect(0, 0, 2, TBH); g.fillRect(W - 2, 0, 2, TBH);
  g.fillStyle = '#fff'; g.fillRect(8, 4, 14, 14); g.fillStyle = '#000'; g.strokeStyle = '#000'; g.lineWidth = 2;
  g.strokeRect(9, 5, 12, 12);                                             // close box
  const label = 'NyanCat'; g.font = 'bold 13px Geneva, Chicago, sans-serif'; g.textBaseline = 'middle'; g.textAlign = 'center';
  const tw = g.measureText(label).width + 12, tx = (W - tw) / 2;
  g.fillStyle = '#fff'; g.fillRect(tx, 2, tw, TBH - 4); g.fillStyle = '#000'; g.strokeRect(tx + 1, 3, tw - 2, TBH - 6);
  g.fillText(label, W / 2, TBH / 2 + 1);
}
let t = 0;
function tick() { g.drawImage(frames[t], 0, TBH); titleBar(); t = (t + 1) % 12; }
titleBar();
setInterval(tick, 90);
</script>
</body>
</html>
