<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Boot</title>
<!--
  Boot Phases: a PC's firmware (AMIBIOS 1992, Award Modular BIOS v4.51PG, Phoenix - AwardBIOS
  v6.00PG) and, later, an OS loader in text mode. 80x25 characters of IBM VGA 9x16 on a
  720x400 canvas, shown at 4:3. Reconstructions: the layouts follow photographs of the
  originals, the logos are drawn here, and the machine is this Mac (window.BOOT, read once by
  RetroMac) — no board, clock speed or drive is made up.
-->
<style>
@font-face { font-family: VGA; src: url('../../Fonts/Px437_IBM_VGA_9x16.ttf'); }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
body { display: grid; place-items: center; }
canvas { image-rendering: pixelated; display: block; }
#live { position: absolute; left: -9999px; }
</style>
</head>
<body>
<canvas id="screen" width="720" height="400" aria-hidden="true"></canvas>
<div id="live" aria-live="polite"></div>
<script>
'use strict';
const send = m => { try { webkit.messageHandlers.boot.postMessage(m); } catch (e) {} };
window.addEventListener('error', e => send({ type: 'error', message: e.message + ' @' + e.lineno }));

const B = window.BOOT || { model: 'Mac', cpu: 'Apple M1', cores: 8, memoryKiB: 8388608,
                           date: '01/01/2026', time: '00:00:00', bios: {} };
B.bios = Object.assign({ quickPOST: true, floppySeek: true, values: {} }, B.bios || {});
B.bios.values = B.bios.values || {};
const Q = new URLSearchParams(location.search);
const FW = Q.get('firmware'), OS = Q.get('os');

// ---------------------------------------------------------------- text-mode screen
const C = document.getElementById('screen'), X = C.getContext('2d');
const CW = 9, CH = 16, COLS = 80, ROWS = 25;
const PAL = ['#000000','#0000AA','#00AA00','#00AAAA','#AA0000','#AA00AA','#AA5500','#AAAAAA',
             '#555555','#5555FF','#55FF55','#55FFFF','#FF5555','#FF55FF','#FFFF55','#FFFFFF'];
function fit() {
  let k = Math.min(innerWidth / 720, innerHeight / 540);
  if (k >= 1) k = Math.floor(k);
  C.style.width = 720 * k + 'px'; C.style.height = 540 * k + 'px';
}
addEventListener('resize', fit); fit();
function clear(bg = 0) { X.fillStyle = PAL[bg]; X.fillRect(0, 0, 720, 400); }
function put(col, row, s, fg = 7, bg = null) {
  s = String(s);
  if (bg !== null) { X.fillStyle = PAL[bg]; X.fillRect(col * CW, row * CH, s.length * CW, CH); }
  X.fillStyle = PAL[fg]; X.font = '16px VGA'; X.textBaseline = 'top';
  for (let i = 0; i < s.length; i++) X.fillText(s[i], (col + i) * CW, row * CH);
}
function centre(row, s, fg = 7, bg = null) { put(Math.floor((COLS - s.length) / 2), row, s, fg, bg); }
function fill(c0, r0, w, h, bg) { X.fillStyle = PAL[bg]; X.fillRect(c0 * CW, r0 * CH, w * CW, h * CH); }
function box(c0, r0, w, h, fg, bg, dbl = true) {
  const [tl, tr, bl, br, hz, vt] = dbl ? '╔╗╚╝═║' : '┌┐└┘─│';
  if (bg !== null) fill(c0, r0, w, h, bg);
  put(c0, r0, tl + hz.repeat(w - 2) + tr, fg);
  for (let r = 1; r < h - 1; r++) { put(c0, r0 + r, vt, fg); put(c0 + w - 1, r0 + r, vt, fg); }
  put(c0, r0 + h - 1, bl + hz.repeat(w - 2) + br, fg);
}
const pad = (s, n) => (String(s) + ' '.repeat(n)).slice(0, n);
const lpad = (s, n) => (' '.repeat(n) + String(s)).slice(-n);
const say = t => { document.getElementById('live').textContent = t; };

// ---------------------------------------------------------------- drawn logos
// The Energy Star mark and Award's ribbon man, drawn here and cut to whole pixels the way
// the BIOS put them on screen with redefined characters. Nothing is copied from a picture.
function pixelArt(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g);
  const d = g.getImageData(0, 0, w, h), p = d.data;
  for (let i = 0; i < p.length; i += 4) p[i + 3] = p[i + 3] > 110 ? 255 : 0;
  g.putImageData(d, 0, 0); return c;
}
const energy = pixelArt(162, 94, g => {
  g.strokeStyle = PAL[14]; g.fillStyle = PAL[14]; g.lineWidth = 2;
  g.beginPath(); g.ellipse(70, 52, 64, 44, 0, Math.PI * 1.02, Math.PI * 1.9); g.stroke();   // the arc
  const sx = 132, sy = 40, R = 26, r = 10; g.beginPath();                                    // the star
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R;
    g.lineTo(sx + Math.cos(a) * q, sy + Math.sin(a) * q); }
  g.closePath(); g.stroke();
  g.font = 'italic bold 34px "Snell Roundhand", "Apple Chancery", cursive';
  g.lineWidth = 1.4; g.strokeText('energy', 8, 68);
  g.fillStyle = PAL[10]; g.fillRect(4, 78, 156, 2);                                           // green rule
  g.font = 'bold 10px Helvetica, Arial, sans-serif'; g.fillText('EPA POLLUTION PREVENTER', 6, 91);
});
const ribbon = pixelArt(24, 32, g => {
  g.fillStyle = PAL[9];
  g.beginPath(); g.arc(13, 6, 5, 0, Math.PI * 2); g.fill();                                   // head
  g.beginPath(); g.moveTo(3, 13); g.lineTo(22, 13); g.lineTo(15, 20); g.lineTo(18, 31);
  g.lineTo(11, 24); g.lineTo(4, 31); g.lineTo(8, 20); g.closePath(); g.fill();               // body
});

// ---------------------------------------------------------------- the firmware
const mb = Math.round(B.memoryKiB / 1024);
// The setup key, as chosen in Settings; a Mac's delete key (⌫) counts as DEL.
const KEY = ['Delete', 'F1', 'F2', 'F10'].includes(B.bios.setupKey) ? B.bios.setupKey : 'Delete';
const KEYNAME = KEY === 'Delete' ? 'DEL' : KEY;
const isSetupKey = e => KEY === 'Delete' ? (e.key === 'Delete' || e.key === 'Backspace') : e.key === KEY;
const idDate = B.date.slice(0, 6) + B.date.slice(8);    // mm/dd/yy
const P = {
  ami92: {
    name: 'AMIBIOS', fg: 7, epa: false, delKey: 'Hit <' + KEYNAME + '> if you want to run SETUP',
    head: ['AMIBIOS (C)1992 American Megatrends Inc.,', B.model + ' (host data)'],
    count: n => lpad(n, 9) + 'KB OK',
    countRow: 3, more: [], id: '(C) American Megatrends Inc., 40-0000-001437-00101111-' + idDate.replace(/\//g, '') + '-HOST-' + B.model,
  },
  award451: {
    name: 'Award', fg: 7, epa: true, delKey: 'Press ' + KEYNAME + ' to enter SETUP',
    head: ['Award Modular BIOS v4.51PG, An Energy Star Ally', 'Copyright (C) 1984-98, Award Software, Inc.'],
    lines: [[3, 'Host board/model : ' + B.model], [5, B.cpu + ' Processor / ' + B.cores + ' cores']],
    count: (n, done) => 'Memory Test : ' + lpad(n, 9) + 'K' + (done ? ' OK' : ''), countRow: 6,
    more: [[8, 'Award Plug and Play BIOS Extension v1.0A'], [9, 'Initialize Plug and Play Cards...'], [10, 'PNP Init Completed']],
    id: B.date + '-HOST-<<' + B.model + '>>', configTitle: ['Award Software, Inc.', 'System Configurations'],
  },
  award600: {
    name: 'Award', fg: 7, epa: true, delKey: 'Press ' + KEYNAME + ' to enter SETUP',
    head: ['Phoenix - AwardBIOS v6.00PG, An Energy Star Ally', 'Copyright (C) 1984-2004, Phoenix Technologies, LTD'],
    lines: [[3, 'Host board/model : ' + B.model], [5, 'Main Processor : ' + B.cpu + ' (' + B.cores + ' cores)']],
    count: (n, done) => 'Memory Testing : ' + lpad(n, 9) + 'K' + (done ? ' OK' : ''), countRow: 6,
    more: [[8, 'Detecting host hardware ...'], [9, 'Host data read, no drives are simulated']],
    id: B.date + '-HOST-<<' + B.model + '>>', configTitle: ['Phoenix Technologies, LTD', 'System Configurations'],
  },
}[FW] || null;

// ---------------------------------------------------------------- POST
let phase = 'post', t0 = 0, setupFrom = null;
// Long enough to read the screen and reach DEL; Quick POST still skips most of the memory count.
const T = () => B.bios.quickPOST ? { count: 1.6, more: 2.4, end: 3.6, config: 2.4 } : { count: 4.0, more: 4.8, end: 6.2, config: 3.0 };
function drawPOST(t) {
  const tm = T(); clear();
  if (!P) return;
  P.head.forEach((s, i) => put(FW === 'ami92' ? 0 : 3, i, s, P.fg));
  if (FW !== 'ami92') X.drawImage(ribbon, 0, 0);
  const epaOff = (B.bios.values[FW + '/Small Logo(EPA) Show'] || 'Enabled') === 'Disabled';
  if (P.epa && !epaOff) X.drawImage(energy, 558, 0);
  if (t > 0.15) (P.lines || []).forEach(([r, s]) => put(0, r, s));
  if (t > 0.3) {
    const f = Math.min(1, (t - 0.3) / tm.count);
    const n = Math.floor(f * B.memoryKiB / 1024) * 1024;
    put(0, P.countRow, P.count(n, f >= 1));
  }
  if (t > tm.more) P.more.forEach(([r, s]) => put(0, r, s));
  const delOff = FW === 'ami92' && (B.bios.values['ami92/Hit <DEL> Message Display'] || 'Enabled') === 'Disabled';
  if (!delOff) put(0, FW === 'ami92' ? 5 : 23, P.delKey, 7);
  if (FW !== 'ami92') put(6, 23, KEYNAME, 15);
  put(0, 24, P.id);
}
function drawConfig() {
  clear();
  const t = P.configTitle; centre(1, t[0]); centre(2, t[1]);
  box(1, 3, 78, 9, 7, null);
  put(40, 3, '╤'); for (let r = 4; r < 11; r++) put(40, r, '│'); put(40, 11, '╧');
  const ext = Math.max(0, B.memoryKiB - 1024);
  const L = [['CPU Type', B.cpu.toUpperCase()], ['CPU Cores', String(B.cores)], ['Host Model', B.model],
             ['Diskette Drive A', 'None'], ['Diskette Drive B', 'None'], ['Pri. Master Disk', 'None'], ['Pri. Slave  Disk', 'None']];
  const R = [['Display Type', 'EGA/VGA'], ['Base Memory', '640K'], ['Extended Memory', ext + 'K'],
             ['Serial Port(s)', 'None'], ['Parallel Port(s)', 'None'], ['Sec. Master Disk', 'None'], ['Sec. Slave  Disk', 'None']];
  L.forEach(([k, v], i) => put(3, 4 + i, pad(k, 17) + ': ' + v.slice(0, 18)));
  R.forEach(([k, v], i) => put(42, 4 + i, pad(k, 17) + ': ' + v.slice(0, 17)));
  put(0, 14, 'Historical POST reconstruction, actual host values');
  put(0, 16, 'Booting Operating System' + (Math.floor(performance.now() / 500) % 2 ? '_' : ' '));
}

        { l: 'Base memory', show: () => '640 KB' }, { l: 'Ext. memory', show: () => extKB + ' KB' } ] },
      bios: { title: 'ADVANCED CMOS SETUP', items: [
        { l: 'Typematic Rate Programming', o: DIS }, { l: 'Typematic Rate Delay (msec)', o: ['500', '250', '750', '1000'] },
        { l: 'Typematic Rate (Chars/Sec)', o: ['15', '6', '8', '10', '12', '20', '24', '30'] },
        { l: 'Above 1 MB Memory Test', o: DIS, real: 'quickPOST', invert: true }, { l: 'Memory Test Tick Sound', o: EN },
        { l: 'Hit <DEL> Message Display', o: EN }, { l: 'Floppy Drive Seek At Boot', o: EN, real: 'floppySeek' },
        { l: 'System Boot Up Sequence', o: ['C:,A:', 'A:,C:'] }, { l: 'System Boot Up Speed', o: ['High', 'Low'] },
        { l: 'System Boot Up Num Lock', o: ['On', 'Off'] }, { l: 'Password Checking Option', o: ['Setup', 'Always'] },
        { l: 'Video ROM Shadow C000,32K', o: EN }, { l: 'Internal Cache Memory', o: EN } ] },
      chip: { title: 'ADVANCED CHIPSET SETUP', items: [
        { l: 'AT Bus Clock Source', o: ['CLKIN/4', 'CLKIN/3', 'CLKIN/5'] }, { l: 'Memory Read Wait State', o: ['1 W/S', '0 W/S'] },
        { l: 'Memory Write Wait State', o: ['1 W/S', '0 W/S'] }, { l: 'Hidden Refresh Control', o: EN } ] },
    },
  },
}[FW];

const S = { page: null, sel: 0, dialog: null, snapshot: null };
const key = it => FW + '/' + it.l;
function value(it) {
  if (it.show) return it.show();
  if (it.real) { const on = !!B.bios[it.real] !== !!it.invert; return on ? 'Enabled' : 'Disabled'; }
  return B.bios.values[key(it)] || it.o[0];
}
function step(it, d) {
  if (!it.o) return;
  const cur = value(it), i = Math.max(0, it.o.indexOf(cur)), next = it.o[(i + d + it.o.length) % it.o.length];
  if (it.real) B.bios[it.real] = (next === 'Enabled') !== !!it.invert;
  else B.bios.values[key(it)] = next;
}
function loadDefaults() {
  for (const k of Object.keys(B.bios.values)) if (k.startsWith(FW + '/')) delete B.bios.values[k];
  B.bios.quickPOST = true; B.bios.floppySeek = true;
}
function enterSetup() {
  if (!SETUP) return;
  phase = 'setup'; S.page = null; S.sel = 0; S.dialog = null;
  S.snapshot = JSON.stringify(B.bios);
  say('BIOS setup. Arrow keys move, Enter opens, Escape goes back, F10 saves and exits.');
  drawSetup();
}
function leaveSetup(save) {
  if (save) send({ type: 'save', bios: B.bios }); else B.bios = JSON.parse(S.snapshot);
  phase = 'config'; t0 = performance.now(); loop();
}
function colours() {
  // 4.51PG: blue with a red bar; 6.00PG: blue main menu, grey pages; AMI: blue and cyan.
  return SETUP.style === 600 ? { bg: 1, fg: 15, hi: 14, bar: 4, page: 7, pfg: 1, val: 1 }
       : SETUP.style === 92  ? { bg: 1, fg: 15, hi: 15, bar: 3, page: 1, pfg: 15, val: 14 }
       : { bg: 1, fg: 15, hi: 15, bar: 4, page: 1, pfg: 15, val: 14 };
}
function drawSetup() {
  const k = colours();
  clear(k.bg);
  if (!S.page) {
    SETUP.title.forEach((s, i) => centre(i, s, 15));
    const top = SETUP.title.length + (SETUP.style === 451 ? 0 : 1), menu = SETUP.menu;
    if (SETUP.style === 92) {
      box(14, top, 52, menu.length + 2, 15, null);
      menu.forEach(([l], i) => put(17, top + 1 + i, pad(l, 46), i === S.sel ? 1 : 15, i === S.sel ? 3 : null));
      put(0, 22, '─'.repeat(80), 15);
      centre(23, 'ESC:Exit  ↑↓:Sel  Enter:Choose  F10:Save & Exit', 15);
    } else {
      const half = Math.ceil(menu.length / 2), h = half * 2 + 1;
      box(1, top, 78, h, 15, null); put(40, top, '╤'); for (let r = 1; r < h - 1; r++) put(40, top + r, '│'); put(40, top + h - 1, '╧');
      menu.forEach(([l], i) => {
        const col = i < half ? 4 : 43, row = top + 1 + (i % half) * 2;
        const mark = SETUP.style === 600 ? '► ' : '';
        if (SETUP.style === 600) put(col - 2, row, '►', 14);
        put(col, row, pad(l, 34), i === S.sel ? 15 : (SETUP.style === 600 ? 14 : 15), i === S.sel ? 4 : null);
      });
      const b = top + h;
      box(1, b, 78, 4, 15, null);
      put(3, b + 1, 'Esc : Quit', 15); put(43, b + 1, '↑ ↓ → ←   : Select Item', 15);
      put(3, b + 2, 'F10 : Save & Exit Setup', 15);
      box(1, b + 4, 78, 3, 15, null); centre(b + 5, menu[S.sel][2] || '', 15);
    }
  } else {
    const pg = SETUP.pages[S.page], items = pg.items;
    clear(k.page);
    if (SETUP.style === 600) { centre(0, SETUP.title[0], 1); centre(1, pg.title, 1); }
    else { centre(0, SETUP.title[0], k.pfg); centre(1, pg.title, k.pfg); if (SETUP.title[2]) centre(2, SETUP.title[2], k.pfg); }
    const top = 4, rows = 16, two = items.length > rows;
    box(0, top - 1, 80, rows + 2, k.pfg, null);
    if (SETUP.style === 600) { put(56, top - 1, '╤', 1); for (let r = 0; r < rows; r++) put(56, top + r, '│', 1); put(56, top + rows, '╧', 1);
      centre(top, '', 1); put(62, top, 'Item Help', 1); put(58, top + 2, 'Menu Level  ►', 1); }
    // Label and value columns as the originals had them: two columns of 26 + 12 when a page is
    // long, one wide column otherwise; 6.00PG keeps its Item Help panel on the right.
    const lw = SETUP.style === 600 ? 27 : (two ? 26 : 30), vw = SETUP.style === 600 ? 24 : (two ? 12 : 44);
    items.forEach((it, i) => {
      const col = two && i >= rows ? 40 : 2, row = top + (two && i >= rows ? i - rows : i);
      const v = SETUP.style === 600 ? '[' + value(it) + ']' : ': ' + value(it), sel = i === S.sel;
      put(col, row, pad(it.l, lw), it.show ? (SETUP.style === 600 ? 8 : 7) : k.pfg);
      put(col + lw, row, pad(v, vw), sel ? 15 : (SETUP.style === 600 ? 1 : k.val), sel ? 4 : null);
    });
    const hint = SETUP.style === 600
      ? ['↑↓→←:Move  Enter:Select  +/-/PU/PD:Value  F10:Save  ESC:Exit', 'F5: Previous Values   F6: Fail-Safe Defaults   F7: Optimized Defaults']
      : ['ESC : Quit   ↑↓→← : Select Item   PU/PD/+/- : Modify', 'F5 : Old Values   F6 : Load BIOS Defaults   F7 : Load Setup Defaults'];
    hint.forEach((s, i) => centre(22 + i, s, k.pfg));
  }
  if (S.dialog) {
    const d = S.dialog, w = Math.max(...d.lines.map(s => s.length)) + 6;
    const c0 = Math.floor((80 - w) / 2), r0 = 10;
    box(c0, r0, w, d.lines.length + 2, 15, 4);
    d.lines.forEach((s, i) => put(c0 + 3, r0 + 1 + i, s, 15));
  }
}
function ask(question, yes, onAnswer) {
  S.dialog = { lines: [question + ' (Y/N)? ' + (yes ? 'Y' : 'N')], yes, onAnswer, yn: true };
  say(question + ', yes or no');
}
function message(lines, then) { S.dialog = { lines, then }; say(lines.join('. ')); }
function choose() {
  if (!S.page) {
    const [label, act] = SETUP.menu[S.sel];
    if (SETUP.pages[act]) { S.page = act; S.sel = 0; say(SETUP.pages[act].title); return; }
    if (act === 'save') return ask(SETUP.style === 92 ? 'Write data into CMOS and exit' : 'SAVE to CMOS and EXIT', true, y => y && leaveSetup(true));
    if (act === 'quit') return ask(SETUP.style === 92 ? 'Quit without saving' : 'Quit Without Saving', false, y => y && leaveSetup(false));
    if (act === 'defaults') return ask(label, false, y => y && loadDefaults());
    if (act === 'pw') return message(['PASSWORD DISABLED !!!', 'Press any key to continue...']);
    if (act === 'ide') return message(['Primary Master   : None', 'Primary Slave    : None', 'Secondary Master : None',
                                       'Secondary Slave  : None', '', 'No drives are simulated.', 'Press any key to continue...']);
  } else {
    const it = SETUP.pages[S.page].items[S.sel]; step(it, 1); say(it.l + ' ' + value(it));
  }
}
function setupKey(e) {
  const k = e.key;
  if (S.dialog) {
    const d = S.dialog;
    if (d.yn) {
      if (k === 'y' || k === 'Y') { d.yes = true; d.lines = [d.lines[0].replace(/[YN]$/, 'Y')]; drawSetup(); return; }
      if (k === 'n' || k === 'N') { d.yes = false; d.lines = [d.lines[0].replace(/[YN]$/, 'N')]; drawSetup(); return; }
      if (k === 'Enter') { S.dialog = null; d.onAnswer(d.yes); }
      if (k === 'Escape') S.dialog = null;
    } else { S.dialog = null; }
    if (phase === 'setup') drawSetup();
    return;
  }
  const n = S.page ? SETUP.pages[S.page].items.length : SETUP.menu.length;
  const half = S.page ? 16 : (SETUP.style === 92 ? n : Math.ceil(n / 2));
  if (k === 'ArrowDown') S.sel = (S.sel + 1) % n;
  else if (k === 'ArrowUp') S.sel = (S.sel - 1 + n) % n;
  else if (k === 'ArrowRight' && !S.page) S.sel = Math.min(n - 1, S.sel + half);
  else if (k === 'ArrowLeft' && !S.page) S.sel = Math.max(0, S.sel - half);
  else if (k === 'Enter') choose();
  else if (S.page && (k === 'PageDown' || k === '+' || k === '=' || k === 'ArrowRight')) { const it = SETUP.pages[S.page].items[S.sel]; step(it, 1); say(it.l + ' ' + value(it)); }
  else if (S.page && (k === 'PageUp' || k === '-' || k === 'ArrowLeft')) { const it = SETUP.pages[S.page].items[S.sel]; step(it, -1); say(it.l + ' ' + value(it)); }
  else if (S.page && k === 'F5') { const keep = JSON.parse(S.snapshot); B.bios.quickPOST = keep.quickPOST; B.bios.floppySeek = keep.floppySeek;
    for (const it of SETUP.pages[S.page].items) if (!it.real && !it.show) { const v = keep.values[key(it)]; if (v) B.bios.values[key(it)] = v; else delete B.bios.values[key(it)]; } }
  else if (k === 'F6' || k === 'F7') ask(k === 'F6' ? 'Load BIOS Defaults' : 'Load SETUP Defaults', false, y => y && loadDefaults());
  else if (k === 'Escape') { if (S.page) { const i = SETUP.menu.findIndex(m => m[1] === S.page); S.page = null; S.sel = Math.max(0, i); say('Main menu'); }
                             else ask(SETUP.style === 92 ? 'Quit without saving' : 'Quit Without Saving', false, y => y && leaveSetup(false)); }
  else if (k === 'F10') ask(SETUP.style === 92 ? 'Write data into CMOS and exit' : 'SAVE to CMOS and EXIT', true, y => y && leaveSetup(true));
  else return;
  drawSetup();
}

// ---------------------------------------------------------------- run
let ready = false, raf = 0, sought = false;
function loop() {
  cancelAnimationFrame(raf);
  const t = (performance.now() - t0) / 1000, tm = T();
  if (phase === 'post') {
    drawPOST(t);
    if (!sought && t > 0.2 && B.bios.floppySeek) { sought = true; send({ type: 'floppy' }); }
    if (t >= tm.end) { phase = FW === 'ami92' ? 'end' : 'config'; t0 = performance.now(); }
  } else if (phase === 'config') {
    drawConfig();
    if (t >= tm.config) { phase = 'end'; }
  }
  if (phase === 'end') { send({ type: 'done' }); return; }
  if (phase === 'post' || phase === 'config') raf = requestAnimationFrame(loop);
  if (!ready) { ready = true; send({ type: 'ready' }); }
}
// ---------------------------------------------------------------- Windows NT 4.0 (?os=nt4)
// OS Loader V4.0 with its BOOT.INI menu, NTDETECT, then the blue kernel screen with this Mac's
// processors and memory; the desktop follows. No log-on box: nothing asks for a password.
const NT = { step: 'loader', sel: 0, count: 3, t0: 0, timer: 0 };
const kb = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
function ntLoader() {
  clear();
  put(0, 1, 'OS Loader V4.0');
  put(0, 3, 'Please select the operating system to start:');
  ['Windows NT Workstation Version 4.00', 'Windows NT Workstation Version 4.00 [VGA mode]'].forEach((c, i) =>
    put(4, 6 + i, pad(c, 72), i === NT.sel ? 0 : 7, i === NT.sel ? 7 : null));
  put(0, 10, 'Use \u2191 and \u2193 to move the highlight to your choice.');
  put(0, 11, 'Press Enter to choose.');
  if (NT.count !== null) put(0, 14, 'Seconds until highlighted choice will be started automatically: ' + NT.count);
}
function ntDetect(t) {
  clear();
  put(0, 0, 'NTDETECT V4.0 Checking Hardware ...');
  if (t > 0.8) { clear(); put(0, 1, 'OS Loader V4.0'); put(0, 3, 'Press spacebar NOW to invoke Hardware Profile/Last Known Good menu');
                 put(0, 5, '.'.repeat(Math.min(40, Math.floor((t - 0.8) * 30)))); }
}
function ntKernel(t) {
  clear(1);
  const cpus = B.cores + ' System Processor' + (B.cores > 1 ? 's' : '');
  put(0, 0, 'Microsoft (R) Windows NT (TM) Version 4.0 (Build 1381).', 15);
  put(0, 1, cpus + ' [' + kb(B.memoryKiB) + ' KB Memory]' + (B.cores > 1 ? '  MultiProcessor Kernel' : ''), 15);
  put(0, 2, '.'.repeat(Math.min(78, Math.floor(t * 18))), 15);
}
function ntRun() {
  cancelAnimationFrame(NT.timer);
  const t = (performance.now() - NT.t0) / 1000;
  if (NT.step === 'detect') { ntDetect(t); if (t > 2.2) { NT.step = 'kernel'; NT.t0 = performance.now(); } }
  else if (NT.step === 'kernel') { ntKernel(t); if (t > 3.2) { send({ type: 'done' }); return; } }
  NT.timer = requestAnimationFrame(ntRun);
}
function ntChoose() { NT.count = null; NT.step = 'detect'; NT.t0 = performance.now(); ntRun(); }
function ntKey(e) {
  if (NT.step === 'loader') {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { NT.sel = 1 - NT.sel; NT.count = null; ntLoader(); say(NT.sel ? 'VGA mode' : 'Windows NT Workstation'); }
    else if (e.key === 'Enter') ntChoose();
    else if (e.key === 'Escape') send({ type: 'skip' });
  } else if (e.key === 'Escape') send({ type: 'skip' });
}
function ntStart() {
  ntLoader(); send({ type: 'ready' }); say('OS Loader. Windows NT Workstation will start in 3 seconds.');
  const tick = setInterval(() => {
    if (NT.step !== 'loader' || NT.count === null) return clearInterval(tick);
    if (--NT.count <= 0) { clearInterval(tick); ntChoose(); } else ntLoader();
  }, 1000);
}

// ---------------------------------------------------------------- AmigaOne U-Boot (?firmware=uboot)
// The AmigaOne's U-Boot 1.1.1 as the 2008 install photos show it: green on black, the CPU and
// memory (this Mac's), then the countdown; a key stops it and opens Hyperion's Boot Select menu.
// The board's FSB and its IDE disks are left out: the Mac has no honest value for them.
const UB = { step: 'console', t0: 0, timer: 0, count: 3, sel: 2, list: false };
const UB_ROWS = ['Boot Device', 'Configuration', '', 'Boot arguments for AmigaOS', 'Boot arguments for Linux'];
const UB_DEV = ['Floppy', 'Onboard VIA IDE CDROM', 'Onboard VIA IDE Disk', 'Network', 'SCSI CDROM', 'SCSI Disk',
                'USB CDROM', 'USB Disk', 'SII Parallel Disk', 'SII Parallel CDROM', 'SII Serial Disk', 'SII Serial CDROM', 'none'];
function ubConsole(t) {
  clear();
  put(0, 0, 'U-Boot 1.1.1 (Mar  3 2005 - 16:42:53)', 10);
  if (t > 0.3) put(0, 2, 'CPU:   ' + B.cpu, 10);
  if (t > 0.5) put(0, 3, 'DRAM:  ' + mb + ' MB', 10);
  if (t > 0.9) put(0, 5, 'Hit any key to stop autoboot: ' + UB.count, 10);
}
function ubMenu() {
  clear();
  box(1, 1, 78, 3, 15, null, false); put(3, 2, 'U-Boot Boot Select', 15);
  box(1, 4, 78, 16, 15, null, false);
  const dev = B.bios.values['uboot/Boot Device'] || UB_DEV[2];
  UB_ROWS.forEach((r, i) => { if (r) put(3, 6 + i, r, 15); });
  put(33, 6, dev, UB.list ? 15 : 0, UB.list ? null : 2);
  if (UB.list) {
    box(32, 5, 25, UB_DEV.length + 2, 15, 0, false);
    UB_DEV.forEach((d, i) => put(33, 6 + i, pad(d, 23), i === UB.sel ? 15 : 12, i === UB.sel ? 2 : null));
  }
  box(1, 20, 78, 4, 15, null, false);
  put(28, 23, 'Menu System (C) 2003 Hyperion Entertainment', 15);
  put(3, 21, UB.list ? 'Up/Down choose, Enter sets the boot device, Esc keeps it' : 'Enter changes the boot device, Esc boots', 7);
}
function ubRun() {
  cancelAnimationFrame(UB.timer);
  const t = (performance.now() - UB.t0) / 1000;
  if (UB.step !== 'console') return;
  UB.count = Math.max(0, 3 - Math.floor(Math.max(0, t - 0.9)));
  ubConsole(t);
  if (t > 3.9) { send({ type: 'done' }); return; }
  UB.timer = requestAnimationFrame(ubRun);
}
function ubKey(e) {
  if (UB.step === 'console') {
    if (e.key === 'Escape') return send({ type: 'skip' });
    cancelAnimationFrame(UB.timer); UB.step = 'menu'; ubMenu(); say('U-Boot Boot Select. Enter changes the boot device, Escape boots.');
    return;
  }
  if (!UB.list) {
    if (e.key === 'Enter') { UB.list = true; UB.sel = Math.max(0, UB_DEV.indexOf(B.bios.values['uboot/Boot Device'] || UB_DEV[2])); say(UB_DEV[UB.sel]); }
    else if (e.key === 'Escape') { send({ type: 'save', bios: B.bios }); return send({ type: 'done' }); }
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    UB.sel = (UB.sel + (e.key === 'ArrowDown' ? 1 : -1) + UB_DEV.length) % UB_DEV.length; say(UB_DEV[UB.sel]);
  } else if (e.key === 'Enter') { B.bios.values['uboot/Boot Device'] = UB_DEV[UB.sel]; UB.list = false; say('Boot device ' + UB_DEV[UB.sel]); }
  else if (e.key === 'Escape') UB.list = false;
  ubMenu();
}
function ubStart() {
  UB.t0 = performance.now(); ubRun(); send({ type: 'ready' });
  say('U-Boot. Press any key to stop autoboot.');
}

addEventListener('keydown', e => {
  e.preventDefault();
  if (OS) return ntKey(e);
  if (FW === 'uboot') return ubKey(e);
  if (phase === 'setup') return setupKey(e);
  if (phase === 'post' && isSetupKey(e)) { cancelAnimationFrame(raf); return enterSetup(); }
  if (e.key === 'Escape') send({ type: 'skip' });
});
addEventListener('mousedown', () => {
  if (OS) return send({ type: 'skip' });
  if (phase !== 'setup') send({ type: 'skip' });
});
setInterval(() => {                                    // the setup's clock keeps going
  if (phase !== 'setup') return;
  const [h, m, s] = B.time.split(':').map(Number), n = (h * 3600 + m * 60 + s + 1) % 86400;
  B.time = [Math.floor(n / 3600), Math.floor(n / 60) % 60, n % 60].map(v => String(v).padStart(2, '0')).join(':');
  if (S.page === 'std' && !S.dialog) drawSetup();
}, 1000);
document.fonts.load('16px VGA').then(() => {
  if (OS === 'nt4') return ntStart();
  if (FW === 'uboot') return ubStart();
  t0 = performance.now();
  if (!P) { send({ type: 'error', message: 'unknown firmware ' + FW }); send({ type: 'done' }); return; }
  say(P.name + ' BIOS starting. ' + (P.delKey));
  loop();
});
</script>
