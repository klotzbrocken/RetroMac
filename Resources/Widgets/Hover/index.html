    <script>window.ieFlyout={init:function(){},show:function(){},hide:function(){},update:function(){}};</script>

    <!--
      Classic mode: the game hides its original pixel-graphics ("retro") version behind an easter
      egg — typing "bambi" on the menu calls router.retro(). Opening this page with ?retro starts
      that classic version directly (RetroMac's "Hover Classic" entry).
    -->
    <script>
    (function(){
      function wantsRetro(){
        return /(^|[?&])retro\b/.test(location.search || '') ||
               /(^|[?&])retro\b/.test(window.__rmQuery || '');
      }
      var started = false;
      function startRetro(){
        if (started || !wantsRetro()) return;
        var tries = 0;
        var iv = setInterval(function(){
          try {
            var H = window.Hover;
            if (H && H.router && typeof H.router.retro === 'function') {
              clearInterval(iv); started = true; H.router.retro(); return;
            }
          } catch (e) {}
          if (++tries > 80) clearInterval(iv);
        }, 250);
      }
      // The host (RetroMac) may hand us the query after load via window.__rmQuery.
      window.addEventListener('rmquery', startRetro);
      startRetro();
    })();
    </script>
</body>
